name: Release

# Push a tag like v1.1 to build and upload to CurseForge + GitHub Releases.
# Pushes to main (and manual runs) build a test zip without uploading anything.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build emote textures
        run: |
          pip install pillow
          python tools/build.py src/public
          # The packager only ships files git knows about; stage the (git-ignored) generated files
          git add -f Emotes EmoteData.lua icon.tga

      - name: Package and upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only (test build)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: BigWigsMods/packager@v2
        with:
          args: -d -z

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: TwitchEmotes_Dogesmile
          path: .release/TwitchEmotes_Dogesmile/
